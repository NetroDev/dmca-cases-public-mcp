name: npm CI (mcp-stdio)

on:
  push:
    branches: [main]
    paths:
      - "packages/mcp-stdio/**"
      - ".github/workflows/npm-ci.yml"
  pull_request:
    paths:
      - "packages/mcp-stdio/**"
      - ".github/workflows/npm-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp-stdio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/mcp-stdio/package-lock.json
      - run: npm ci
      - run: npm run build
